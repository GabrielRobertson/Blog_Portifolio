<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #F0F0FF;
            --sidebar-bg: #E2DFFF;
            --primary-purple: #6C5CE7;
            --green-accent: #A2E0C8;
            --text-dark: #333355;
            --text-light: #5A5A7B;
            --border-light: #DCDCDC;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-dark);
        }

        .bg-card { background-color: var(--card-bg); }
        .border-border-light { border-color: var(--border-light); }
        .text-text-dark { color: var(--text-dark); }
        .text-text-light { color: var(--text-light); }
        .bg-primary-purple { background-color: var(--primary-purple); }

    </style>
</head>
<body class="bg-bg-page text-text-light">

    <main class="w-full max-w-lg p-8 mx-auto">
        <div class="bg-card rounded-2xl shadow-xl border border-border-light p-8 lg:p-12 text-center">
            <h2 class="text-3xl font-bold mb-2 text-text-dark">LOGIN ADMIN</h2>
            <p class="mb-8">Acesso restrito para administradores.</p>

            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label for="username" class="sr-only">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Usuário" required class="w-full px-5 py-3 rounded-lg border border-border-light bg-sidebar-bg text-text-dark focus:outline-none focus:ring-2 focus:ring-primary-purple transition-colors duration-300">
                </div>
                <div>
                    <label for="password" class="sr-only">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Senha" required class="w-full px-5 py-3 rounded-lg border border-border-light bg-sidebar-bg text-text-dark focus:outline-none focus:ring-2 focus:ring-primary-purple transition-colors duration-300">
                </div>
                <button type="submit" class="w-full bg-primary-purple text-white font-semibold py-3 px-6 rounded-lg hover:bg-opacity-90 transition-colors duration-300">Entrar</button>
            </form>

            <div class="mt-8 text-sm">
                <a href="#" class="text-primary-purple hover:underline">Esqueceu sua senha?</a>
            </div>
        </div>
    </main>

</body>
</html>
